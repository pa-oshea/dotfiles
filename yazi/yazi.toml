[mgr]
# Layout and display options
layout = [1, 4, 3]
sort_by = "alphabetical"
sort_dir_first = true
sort_translit = false
show_symlink = true
scrolloff = 5
mouse_events = ["click", "scroll"]
title_format = "Yazi: {cwd}"

[preview]
# Preview settings
tab_size = 2
max_width = 600
max_height = 900
image_quality = 75

